<!DOCTYPE html>
<html>
<head>
    <title>100 Days of Code Tracker</title>
</head>
<body>
    <h2>100 Days of Code – Daily Log</h2>

    <form method="POST">
        <label>What did you learn today?</label><br>
        <input type="text" name="learned"><br><br>

        <label>What did you build today?</label><br>
        <input type="text" name="built"><br><br>

        <label>Reflection</label><br>
        <input type="text" name="reflection"><br><br>

        <button type="submit">Save Log</button>
    </form>

    <p>{{ message }}</p>
</body>
</html>
