<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PRO | Advanced Biometric Surveillance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.10.0/tf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --neon-amber: #ffaa00;
            --dark-bg: #020204;
            --panel-bg: rgba(10, 15, 30, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

        /* Animated Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 1000px;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Holographic UI Elements */
        .holo-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.05),
                inset 0 0 30px rgba(0, 243, 255, 0.02);
            position: relative;
            overflow: hidden;
        }

        .holo-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Corner Accents */
        .corner-accent {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
            transition: all 0.3s ease;
        }

        .corner-tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .corner-tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
        .corner-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
        .corner-br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

        .holo-panel:hover .corner-accent {
            width: 30px;
            height: 30px;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Glowing Elements */
        .glow-text {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        .glow-border {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Cyber Buttons */
        .cyber-btn {
            position: relative;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            overflow: hidden;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        .cyber-btn:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .cyber-btn.active {
            background: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }

        .cyber-btn.danger {
            border-color: rgba(255, 0, 85, 0.4);
            color: #ff0055;
        }

        .cyber-btn.danger:hover {
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        /* Form Elements */
        .cyber-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s;
        }

        .cyber-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .cyber-input::placeholder {
            color: rgba(0, 243, 255, 0.4);
        }

        /* Toggle Switch */
        .cyber-toggle {
            appearance: none;
            width: 50px;
            height: 26px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cyber-toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #555;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .cyber-toggle:checked {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
        }

        .cyber-toggle:checked::after {
            left: 26px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Video Container */
        .video-feed {
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .video-feed::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }

        /* Scanning Animation */
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 20px var(--neon-cyan);
            animation: scan 2s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Detection Overlay */
        .detection-box {
            position: absolute;
            border: 2px solid var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            transition: all 0.3s;
        }

        .detection-box::before,
        .detection-box::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--neon-green);
        }

        .detection-box::before {
            top: -2px;
            left: -2px;
            border-right: 0;
            border-bottom: 0;
        }

        .detection-box::after {
            bottom: -2px;
            right: -2px;
            border-left: 0;
            border-top: 0;
        }

        .detection-label {
            position: absolute;
            top: -25px;
            left: 0;
            background: var(--neon-green);
            color: #000;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            white-space: nowrap;
        }

        /* Age Stabilizer Indicator */
        .stability-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        .stability-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            transition: width 0.5s ease;
        }

        /* Database Panel */
        .db-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 243, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .db-item:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: translateX(5px);
        }

        .db-item.selected {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 3px;
        }

        /* Modal */
        .cyber-modal {
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
        }

        /* Loading Spinner */
        .cyber-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--neon-cyan);
            border-right-color: var(--neon-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Indicators */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-online { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .status-offline { background: #ff0055; box-shadow: 0 0 10px #ff0055; }
        .status-warning { background: var(--neon-amber); box-shadow: 0 0 10px var(--neon-amber); }

        /* Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--neon-cyan);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(0, 243, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased">

    <div class="cyber-grid"></div>

    <!-- Header -->

        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 border-2 border-cyan-400 rounded-lg flex items-center justify-center relative overflow-hidden group">

                    <svg class="w-6 h-6 text-cyan-400 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        HALT
                    </span>
                </button>
            </div>
        </div>
    </header>

        <!-- Left Sidebar - Controls & Database -->
        <aside class="col-span-3 flex flex-col gap-4 overflow-hidden">
            
            <!-- Source Selection -->
            <div class="holo-panel rounded-lg p-4 flex-shrink-0">
                <div class="corner-accent corner-tl"></div>
                <div class="corner-accent corner-br"></div>
                
                <h3 class="font-orbitron text-cyan-400 text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            </div>
