<!DOCTYPE html>
<html>
<head>
  <title>100 Days of Code – Daily Log</title>
</head>
<body>

<h2>100 Days of Code – Daily Log</h2>

<form id="logForm">
  <input type="text" id="learned" placeholder="What did you learn?" required><br><br>
  <input type="text" id="built" placeholder="What did you build?" required><br><br>
  <input type="text" id="reflection" placeholder="Reflection" required><br><br>
  <button type="submit">Submit Log</button>
</form>

<p id="status"></p>

<script>
const token = "PASTE_YOUR_GITHUB_TOKEN_HERE";
const owner = "YOUR_GITHUB_USERNAME";
const repo = "100-days-of-code";

document.getElementById("logForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const learned = document.getElementById("learned").value;
  const built = document.getElementById("built").value;
  const reflection = document.getElementById("reflection").value;
  const today = new Date().toISOString().split("T")[0];

  const response = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/issues`,
    {
      method: "POST",
      headers: {
        "Authorization": `token ${token}`,
        "Accept": "application/vnd.github+json"
      },
      body: JSON.stringify({
        title: `Day Log – ${today}`,
        body: `**Learned:** ${learned}\n\n**Built:** ${built}\n\n**Reflection:** ${reflection}`
      })
    }
  );

  if (response.ok) {
    document.getElementById("status").innerText = "✅ Log saved to GitHub!";
  } else {
    document.getElementById("status").innerText = "❌ Error saving log.";
  }
});
</script>

</body>
</html>
