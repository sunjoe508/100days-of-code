<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS | Professional Biometric Identification System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-card: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Professional Layout */
        .app-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .app-header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        /* Main Workspace */
        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            gap: 1px;
            background: var(--border);
            overflow: hidden;
        }

        @media (max-width: 1200px) {
            .workspace {
                grid-template-columns: 240px 1fr 260px;
            }
        }

        @media (max-width: 968px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .sidebar-left, .sidebar-right {
                max-height: 200px;
                overflow-y: auto;
            }
        }

        @media (max-width: 640px) {
            .workspace {
                display: flex;
                flex-direction: column;
            }
            .sidebar-left, .sidebar-right {
                max-height: none;
            }
        }

        /* Panels */
        .panel {
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        /* Video Feed */
        .video-container {
            position: relative;
            background: #000;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-element {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Detection Box */
        .detection-box {
            position: absolute;
            border: 2px solid var(--success);
            background: rgba(5, 150, 105, 0.1);
        }

        .detection-label {
            position: absolute;
            top: -24px;
            left: 0;
            background: var(--success);
            color: white;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Controls */
        .control-group {
            margin-bottom: 1.25rem;
        }

        .control-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .input-field {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        /* Toggle Switch */
        .toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: var(--bg-dark);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle:hover {
            background: rgba(255,255,255,0.05);
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--bg-card);
            border-radius: 12px;
            position: relative;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .toggle.active .toggle-switch {
            background: var(--primary);
        }

        .toggle.active .toggle-switch::after {
            transform: translateX(20px);
        }

        /* Data Display */
        .data-card {
            background: var(--bg-dark);
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.375rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            color: var(--text-secondary);
        }

        .data-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Status Indicators */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-online {
            background: rgba(5, 150, 105, 0.2);
            color: var(--success);
        }

        .status-offline {
            background: rgba(220, 38, 38, 0.2);
            color: var(--danger);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Progress Bar */
        .progress-bar {
            height: 4px;
            background: var(--bg-card);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Bottom Bar */
        .bottom-bar {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            overflow-x: auto;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-panel);
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1rem;
            overflow-y: auto;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }

        /* Utility */
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }
        
        .hidden { display: none !important; }
        
        /* Mobile Optimizations */
        @media (pointer: coarse) {
            .btn {
                min-height: 44px;
            }
            .toggle {
                min-height: 44px;
            }
            .input-field {
                font-size: 16px; /* Prevent zoom on iOS */
            }
        }

        /* Loading State */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--border) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">N</div>
                <div>
                    <h1 class="font-semibold text-sm tracking-wide">NEXUS BIOMETRIC</h1>
                    <p class="text-xs text-gray-400">Identification System v2.0</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2 text-xs">
                    <span class="status-badge status-online">
                        <span class="status-dot"></span>
                        System Online
                    </span>
                    <span class="text-gray-400" id="dbStatusBadge">No Database</span>
                </div>
                <button onclick="emergencyStop()" class="btn btn-danger px-3 py-1.5 text-xs w-auto">
                    STOP
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">
            <!-- Left Sidebar - Controls -->
            <aside class="panel sidebar-left">
                <div class="panel-header">
                    <span>Input Source</span>
                    <span class="text-xs font-normal normal-case" id="sourceStatus">Standby</span>
                </div>
                
                <div class="panel-content">
                    <!-- Camera Controls -->
                    <div class="control-group">
                        <button onclick="activateCamera()" class="btn btn-primary mb-2" id="btnCamera">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            </svg>
                            Local Camera
                        </button>
                        
                        <div class="space-y-2">
                            <input type="text" id="ipInput" placeholder="IP Camera URL" class="input-field text-xs">
                            <button onclick="connectIPCamera()" class="btn btn-secondary text-xs" id="btnIP">
                                Connect IP Camera
                            </button>
                        </div>
                        
                        <button onclick="document.getElementById('fileInput').click()" class="btn btn-secondary mt-2 text-xs">
                            Upload File
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept="image/*,video/*" onchange="handleFile(event)">
                    </div>

                    <!-- Analysis Modules -->
                    <div class="control-group">
                        <label class="control-label">Analysis Modules</label>
                        
                        <div class="toggle active" onclick="toggleModule('face', this)">
                            <span class="text-sm">Face Recognition</span>
                            <div class="toggle-switch"></div>
                        </div>
                        
                        <div class="toggle" onclick="toggleModule('age', this)">
                            <span class="text-sm">Age Estimation</span>
                            <div class="toggle-switch"></div>
                        </div>
                        
                        <div class="toggle" onclick="toggleModule('body', this)">
                            <span class="text-sm">Body Metrics</span>
                            <div class="toggle-switch"></div>
                        </div>
                        
                        <div class="toggle" onclick="toggleModule('gait', this)">
                            <span class="text-sm">Gait Analysis</span>
                            <div class="toggle-switch"></div>
                        </div>
                    </div>

                    <!-- Database -->
                    <div class="control-group">
                        <label class="control-label">Database</label>
                        <button onclick="openDbModal()" class="btn btn-secondary text-xs mb-2">
                            Configure Database
                        </button>
                        <button onclick="loadDemoData()" class="btn btn-secondary text-xs">
                            Load Demo Data
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Center - Video Feed -->
            <main class="panel" style="background: #000;">
                <div class="panel-header" style="background: transparent; border-color: rgba(255,255,255,0.1);">
                    <span class="text-white">Video Feed</span>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-mono" id="resolution">-- x --</span>
                        <span class="text-xs font-mono text-success" id="fpsDisplay">-- FPS</span>
                    </div>
                </div>
                
                <div class="video-container" id="videoContainer">
                    <video id="video" class="video-element hidden" autoplay playsinline></video>
                    <img id="imageDisplay" class="video-element hidden" alt="Input">
                    <canvas id="overlay" class="overlay-canvas"></canvas>
                    
                    <div id="placeholder" class="text-center p-8">
                        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-800 flex items-center justify-center">
                            <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <p class="text-gray-500 text-sm">Select input source to begin</p>
                    </div>
                </div>
            </main>

            <!-- Right Sidebar - Results -->
            <aside class="panel sidebar-right">
                <div class="
